AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  SAM stack for demo chatbot: Cognito (UserPool + UserPoolClient + IdentityPool),
  Roles, Amazon Bedrock Agent (plus alias) and an Amplify App + Branch (IaC).
  Amplify can be optionally linked to a GitHub repo if GitHubRepo is provided.

Parameters:
  EnvironmentName:
    Type: String
    Default: demo
    Description: Environment name prefix

  CallbackURLs:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/"
    Description: Callback URLs for the Cognito App Client (comma-separated)

  LogoutURLs:
    Type: CommaDelimitedList
    Default: "http://localhost:5173/"
    Description: Sign out URLs for the Cognito App Client (comma-separated)

  BedrockModelId:
    Type: String
    Default: "amazon.nova-micro-v1:0"
    Description: Foundation model id to use for the Bedrock Agent (adjust per region)

  BedrockAgentName:
    Type: String
    Default: "chatbot-demo-agent"
    Description: Name for the Bedrock Agent

  GitHubRepo:
    Type: String
    Default: ""
    Description: "Repository URL (optional, left empty when not linking to GitHub). Example: https://github.com/OWNER/REPO or OWNER/REPO"

  GitHubAccessTokenSecretName:
    Type: String
    Default: ""
    Description: "Secrets Manager secret name for GitHub PAT (optional). Secret JSON must include key 'github_token'"

  AmplifyBranchName:
    Type: String
    Default: main
    Description: "Branch name to create in Amplify (default: main)"

Conditions:
  UseGitHub: !Not [ !Equals [ !Ref GitHubRepo, "" ] ]

Resources:

  ### Cognito User Pool
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub "${EnvironmentName}-userpool"
      AutoVerifiedAttributes:
        - email
      UsernameAttributes:
        - email
      Schema:
        - Name: email
          Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireUppercase: false
          RequireSymbols: false

  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub "${EnvironmentName}-userpool-client"
      UserPoolId: !Ref CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
        - code
      AllowedOAuthScopes:
        - email
        - openid
        - profile
      CallbackURLs: !Ref CallbackURLs
      LogoutURLs: !Ref LogoutURLs

  ### Cognito Identity Pool (Federated Identities)
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: !Sub "${EnvironmentName}-identity-pool"
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
        - ClientId: !Ref CognitoUserPoolClient
          ProviderName: !Sub "cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}"
          ServerSideTokenCheck: false

  ### IAM Role for Authenticated Users (frontend)
  CognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess   # demo convenience
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
        - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess

  CognitoUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                "cognito-identity.amazonaws.com:aud": !Ref CognitoIdentityPool
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess

  ### Attach roles to Identity Pool
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref CognitoIdentityPool
      Roles:
        authenticated: !GetAtt CognitoAuthRole.Arn
        unauthenticated: !GetAtt CognitoUnauthRole.Arn

  ### Service Role for Bedrock Agent (the agent's resource role)
  BedrockAgentServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - bedrock.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Path: /

  ### Bedrock Agent (minimal)
  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName: !Ref BedrockAgentName
      AgentResourceRoleArn: !GetAtt BedrockAgentServiceRole.Arn
      FoundationModel: !Ref BedrockModelId
      AutoPrepare: true
      Instruction: >
        You are a helpful and concise assistant that answers user questions,
        follows safety guidelines, and returns clear, actionable responses.
      Description: !Sub "Agent created by stack ${AWS::StackName}"

  ### Bedrock Agent Alias
  BedrockAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId: !GetAtt BedrockAgent.AgentId
      AgentAliasName: !Sub "${EnvironmentName}-alias"
      Description: "Alias created by SAM template"
    DependsOn: BedrockAgent

  # --------------------------------------- [SINGLE TABLE DESIGN CHATBOT] ---------------------------------------
  PetsChatbotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-chatdata"
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES

  # --------------------------------------- [API CREACION DE NUEVOS CHATS] ---------------------------------------
  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-ChatApi"
      StageName: Prod
      Cors:
        AllowMethods: "'OPTIONS,GET,POST,PUT,DELETE'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowOrigin: "'*'"

  # --------------------------------------- [API CREACION DE NUEVOS CHATS] ---------------------------------------
  ChatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-new-chat-api"
      Description: "API para crear chats en DynamoDB"
      CodeUri: backend/chat_api/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE: !Ref PetsChatbotTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PetsChatbotTable
      Events:
        ApiPost:
          Type: Api
          Properties:
            Path: /chats
            Method: post
            RestApiId: !Ref ChatApi

  # --------------------------------------- [API PARA GUARDAR MENSAJES] ---------------------------------------
  StoreMessageApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-store-message-api"
      Description: "API para guardar mensajes de usuario y agente en DynamoDB"
      CodeUri: backend/save-chat-message/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE: !Ref PetsChatbotTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PetsChatbotTable
      Events:
        ApiPostMessage:
          Type: Api
          Properties:
            Path: /chats/{chatId}/messages
            Method: post
            RestApiId: !Ref ChatApi

  # --------------------------------------- [LAMBDA OBTENER CHATS DE USUARIO] ---------------------------------------
  GetUserChatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-user-chats"
      Description: "Devuelve todos los chats asociados a un usuario (por email)"
      CodeUri: backend/get_chats/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE: !Ref PetsChatbotTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PetsChatbotTable
      Events:
        ApiGetUserChats:
          Type: Api
          Properties:
            Path: /chats
            Method: get
            RestApiId: !Ref ChatApi

  # --------------------------------------- [LAMBDA OBTENER MENSAJES DE UN CHAT] ---------------------------------------
  GetChatMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-get-chat-messages"
      Description: "Devuelve todos los mensajes asociados a un chat específico"
      CodeUri: backend/get_messages/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE: !Ref PetsChatbotTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref PetsChatbotTable
      Events:
        ApiGetChatMessages:
          Type: Api
          Properties:
            Path: /chats/{chatId}/messages
            Method: get
            RestApiId: !Ref ChatApi



  # --------------------------------------- [LAMBDA ACTUALIZAR NOMBRE DE CHAT] ---------------------------------------
  UpdateChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-update-chat"
      Description: "Actualiza el nombre de un chat en DynamoDB (PUT /chats/{chatId})"
      CodeUri: backend/update-chat/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE: !Ref PetsChatbotTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PetsChatbotTable
      Events:
        ApiPutChat:
          Type: Api
          Properties:
            Path: /chats/{chatId}
            Method: put
            RestApiId: !Ref ChatApi



  # --------------------------------------- [LAMBDA ELIMINAR CHAT + MENSAJES] ---------------------------------------
  DeleteChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-delete-chat"
      Description: "Elimina un chat y todos sus mensajes en DynamoDB (DELETE /chats/{chatId})"
      CodeUri: backend/delete-chat/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE: !Ref PetsChatbotTable
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref PetsChatbotTable
      Events:
        ApiDeleteChat:
          Type: Api
          Properties:
            Path: /chats/{chatId}
            Method: delete
            RestApiId: !Ref ChatApi




  # --------------------------------------- [-----------------------------------------] ---------------------------------------


  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-amplify-service-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - amplify.amazonaws.com
                - codebuild.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AdministratorAccess

  ### -------------------- Amplify App (IaC) — con BuildSpec para Vite --------------------
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name: !Sub "${EnvironmentName}-amplify-app"
      # Si se proporciona GitHubRepo, CloudFormation añade Repository y AccessToken vía condition
      Repository: !If [ UseGitHub, !Ref GitHubRepo, !Ref "AWS::NoValue" ]
      AccessToken: !If
        - UseGitHub
        - !Sub "{{resolve:secretsmanager:${GitHubAccessTokenSecretName}:SecretString:github_token}}"
        - !Ref "AWS::NoValue"
      IAMServiceRole: !GetAtt AmplifyServiceRole.Arn 
      # Environment variables: incluimos ambas formas (REACT_APP_* y VITE_*)
      EnvironmentVariables:
        - Name: REACT_APP_USER_POOL_ID
          Value: !Ref CognitoUserPool
        - Name: REACT_APP_USER_POOL_CLIENT_ID
          Value: !Ref CognitoUserPoolClient
        - Name: REACT_APP_IDENTITY_POOL_ID
          Value: !Ref CognitoIdentityPool
        - Name: REACT_APP_REGION
          Value: !Ref AWS::Region
        - Name: REACT_APP_BEDROCK_AGENT_ID
          Value: !GetAtt BedrockAgent.AgentId
        # Vite-specific envs (prefijo VITE_ para ser accesibles en el bundle cliente)
        - Name: VITE_USER_POOL_ID
          Value: !Ref CognitoUserPool
        - Name: VITE_USER_POOL_CLIENT_ID
          Value: !Ref CognitoUserPoolClient
        - Name: VITE_IDENTITY_POOL_ID
          Value: !Ref CognitoIdentityPool
        - Name: VITE_REGION
          Value: !Ref AWS::Region
        - Name: VITE_BEDROCK_AGENT_ID
          Value: !GetAtt BedrockAgent.AgentId
        - Name: VITE_SEARCH_API_URL
          Value: !Sub "https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"

      # BuildSpec para proyectos con Vite -> produce 'dist' por defecto
      BuildSpec: |
        version: 1
        frontend:
          phases:
            preBuild:
              commands:
                - if [ -f package-lock.json ]; then npm ci; else npm install; fi
            build:
              commands:
                - npm run build
          artifacts:
            baseDirectory: dist
            files:
              - "**/*"
          cache:
            paths:
              - node_modules/**/*


  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId: !GetAtt AmplifyApp.AppId
      BranchName: !Ref AmplifyBranchName
      EnableAutoBuild: !If [ UseGitHub, true, false ]
      EnablePerformanceMode: false
      Stage: PRODUCTION
    DependsOn: AmplifyApp



# ----------------- ZERO-ETL / OpenSearch Ingestion resources -----------------

# ---------- OpenSearch Serverless collection + required encryption policy ----------
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name: !Sub "${EnvironmentName}-chat-encryption-policy"
      Type: encryption
      Description: "Encryption policy for chat collection"
      Policy: !Sub |
        {"Rules":[{"ResourceType":"collection","Resource":["collection/${EnvironmentName}-chat-collection"]}],"AWSOwnedKey":true}


  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    Properties:
      Name: !Sub "${EnvironmentName}-chat-collection"   # usa Name (3-32 chars, lowercase, a-z0-9-)
      Type: SEARCH
      Description: "Serverless collection for chatbot (search)"
    DependsOn:
      - OpenSearchEncryptionPolicy



# ---------- IAM role para OSIS pipeline (lee DDB stream, escribe en AOSS) ----------
  OpenSearchIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-osis-pipeline-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - osis-pipelines.amazonaws.com
            Action: sts:AssumeRole
      Path: "/"
      Policies:
        - PolicyName: AllowDDBReadAndAossWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:DescribeStream
                  - dynamodb:GetRecords
                  - dynamodb:GetShardIterator
                  - dynamodb:ListStreams
                  - dynamodb:DescribeTable
                Resource:
                  - !GetAtt PetsChatbotTable.StreamArn

              - Effect: Allow
                Action:
                  - aoss:BatchPutDocument
                  - aoss:CreateIndex
                  - aoss:APIAccessAll
                  - aoss:BatchGetCollection
                Resource:
                  - !GetAtt OpenSearchCollection.Arn

              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"

              - Effect: Allow
                Action:
                  - aoss:GetSecurityPolicy
                  - aoss:CreateSecurityPolicy
                  - aoss:UpdateSecurityPolicy
                  - aoss:DeleteSecurityPolicy
                  - aoss:ListSecurityPolicies
                Resource: "*"



  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${EnvironmentName}-data-access-policy"
      Type: data
      Description: "Allow ingestion and search roles access"
      Policy:
        Fn::Sub:
          - |
            [
              {
                "Description": "Allow ingestion and search roles access",
                "Rules": [
                  {
                    "ResourceType": "collection",
                    "Resource": ["collection/${CollectionName}"],
                    "Permission": ["aoss:CreateCollectionItems","aoss:DescribeCollectionItems"]
                  },
                  {
                    "ResourceType": "index",
                    "Resource": ["index/${CollectionName}/${IndexName}"],
                    "Permission": ["aoss:ReadDocument","aoss:WriteDocument","aoss:CreateIndex","aoss:DescribeIndex"]
                  }
                ],
                "Principal": [
                  "${IngestRoleArn}",
                  "${SearchRoleArn}"
                ]
              }
            ]
          - {
              "IngestRoleArn": !GetAtt OpenSearchIngestionRole.Arn,
              "SearchRoleArn": !GetAtt SearchApiFunctionRole.Arn,
              "CollectionName": !Sub "${EnvironmentName}-chat-collection",
              "IndexName": "chats"
            }




  # Security Group para las ENIs de la Lambda (SearchApiFunction)
  SearchApiLambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "SG for Lambda ENIs (SearchApiFunction) (${EnvironmentName})"
      VpcId: "vpc-0e68c47c58043c095"
      GroupName: !Sub "${EnvironmentName}-search-lambda-sg"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-search-lambda-sg"

  # Security Group para el OpenSearch Serverless VPC Endpoint
  OpenSearchEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub "SG for OpenSearch Serverless VPC Endpoint (${EnvironmentName})"
      VpcId: "vpc-0e68c47c58043c095"
      GroupName: !Sub "${EnvironmentName}-aoss-endpoint-sg"
      Tags:
        - Key: Name
          Value: !Sub "${EnvironmentName}-aoss-endpoint-sg"


  # Permitir desde las ENIs de Lambda hacia el endpoint (TCP 443)
  OpenSearchEndpointIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref OpenSearchEndpointSecurityGroup
      IpProtocol: tcp
      FromPort: 443
      ToPort: 443
      SourceSecurityGroupId: !Ref SearchApiLambdaSecurityGroup



  # -------------------- OpenSearch Serverless VPC Endpoint --------------------
  OpenSearchVPCEndpoint:
    Type: AWS::OpenSearchServerless::VpcEndpoint
    Properties:
      Name: !Sub "${EnvironmentName}chatvpce"
      VpcId: "vpc-0e68c47c58043c095"
      SubnetIds:
        - subnet-09007170ff72ea713
        # (opcional) añade otra subnet aquí si la tienes
      SecurityGroupIds:
        - !Ref OpenSearchEndpointSecurityGroup
    DependsOn:
      - OpenSearchEndpointSecurityGroup


  # -------------------- Access policy that allows only the created VPCE to call the collection --------------------
  OpenSearchVpcAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    Properties:
      Name: !Sub "${EnvironmentName}-data-access-from-roles"
      Type: data
      Description: !Sub "Allow read access to 'chats' index for the Lambda search role and the ingestion role"
      Policy:
        Fn::Sub:
          - >
            [
              {
                "Description":"Allow Lambda and ingestion role read access to chats index",
                "Rules":[
                  {
                    "ResourceType":"index",
                    "Resource":["index/${CollectionName}/${IndexName}"],
                    "Permission":["aoss:ReadDocument"]
                  }
                ],
                "Principal":[ "${SearchRoleArn}", "${IngestRoleArn}" ]
              }
            ]
          - {
              "CollectionName": !Sub "${EnvironmentName}-chat-collection",
              "IndexName": "chats",
              "SearchRoleArn": !GetAtt SearchApiFunctionRole.Arn,
              "IngestRoleArn": !GetAtt OpenSearchIngestionRole.Arn
            }
    DependsOn:
      - OpenSearchCollection



  # IAM Role explícito para la Lambda de búsqueda (SearchApiFunctionRole)
  SearchApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-search-api-role-${AWS::AccountId}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - sts:AssumeRole
      Path: /
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole
      Policies:
        - PolicyName: SearchApiInlinePolicy
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*"


# ---------- Search Lambda function ----------
  SearchApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-search-chats"
      Description: "Search chats via OpenSearch"
      CodeUri: backend/search_chats/
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt SearchApiFunctionRole.Arn
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT: !GetAtt OpenSearchCollection.CollectionEndpoint
          OPENSEARCH_INDEX: "chats"
      VpcConfig:
        SecurityGroupIds:
          - !Ref SearchApiLambdaSecurityGroup
        SubnetIds:
          - subnet-09007170ff72ea713

      Events:
        ApiSearchChats:
          Type: Api
          Properties:
            Path: /search/chats
            Method: get
            RestApiId: !Ref ChatApi
    DependsOn:
      - OpenSearchVPCEndpoint
      - SearchApiFunctionRole






Outputs:
  UserPoolId:
    Description: Cognito User Pool Id
    Value: !Ref CognitoUserPool
    Export:
      Name: !Sub "${AWS::StackName}:UserPoolId"

  UserPoolClientId:
    Description: Cognito User Pool Client Id
    Value: !Ref CognitoUserPoolClient
    Export:
      Name: !Sub "${AWS::StackName}:UserPoolClientId"

  IdentityPoolId:
    Description: Cognito Identity Pool Id
    Value: !Ref CognitoIdentityPool
    Export:
      Name: !Sub "${AWS::StackName}:IdentityPoolId"

  CognitoAuthRoleArn:
    Description: ARN of authenticated role used by identity pool
    Value: !GetAtt CognitoAuthRole.Arn

  BedrockAgentArn:
    Description: ARN of the created Bedrock Agent
    Value: !GetAtt BedrockAgent.AgentArn

  BedrockAgentId:
    Description: Bedrock Agent Id
    Value: !GetAtt BedrockAgent.AgentId

  AmplifyAppId:
    Description: Amplify App Id
    Value: !GetAtt AmplifyApp.AppId

  AmplifyBranchArn:
    Description: Amplify Branch ARN (constructed)
    Value:
      Fn::Sub:
        - "arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AppId}/branches/${BranchName}"
        - {
            AppId: !GetAtt AmplifyApp.AppId,
            BranchName: !Ref AmplifyBranchName
          }


  OpenSearchCollectionName:
    Description: "OpenSearch Serverless collection name"
    Value: !Ref OpenSearchCollection
    Export:
      Name: !Sub "${AWS::StackName}:OpenSearchCollectionName"


  DynamoDBStreamArn:
    Description: "DynamoDB Stream ARN (usar para debug/políticas)"
    Value: !GetAtt PetsChatbotTable.StreamArn
    Export:
      Name: !Sub "${AWS::StackName}:DDBStreamArn"


  SearchApiUrl:
    Description: "Endpoint público del API para búsquedas (stage Prod)"
    Value: !Sub "https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/search"
    Export:
      Name: !Sub "${AWS::StackName}:SearchApiUrl"

  OpenSearchCollectionEndpoint:
    Description: "OpenSearch Serverless collection endpoint"
    Value: !GetAtt OpenSearchCollection.CollectionEndpoint
    Export:
      Name: !Sub "${AWS::StackName}:OpenSearchCollectionEndpoint"
