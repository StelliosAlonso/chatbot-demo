AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: 'SAM stack for demo chatbot: Cognito (UserPool + UserPoolClient + IdentityPool),
  Roles, Amazon Bedrock Agent (plus alias) and an Amplify App + Branch (IaC). Amplify
  can be optionally linked to a GitHub repo if GitHubRepo is provided.

  '
Parameters:
  EnvironmentName:
    Type: String
    Default: demo
    Description: Environment name prefix
  CallbackURLs:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: Callback URLs for the Cognito App Client (comma-separated)
  LogoutURLs:
    Type: CommaDelimitedList
    Default: http://localhost:5173/
    Description: Sign out URLs for the Cognito App Client (comma-separated)
  BedrockModelId:
    Type: String
    Default: amazon.nova-micro-v1:0
    Description: Foundation model id to use for the Bedrock Agent (adjust per region)
  BedrockAgentName:
    Type: String
    Default: chatbot-demo-agent
    Description: Name for the Bedrock Agent
  GitHubRepo:
    Type: String
    Default: ''
    Description: 'Repository URL (optional, left empty when not linking to GitHub).
      Example: https://github.com/OWNER/REPO or OWNER/REPO'
  GitHubAccessTokenSecretName:
    Type: String
    Default: ''
    Description: Secrets Manager secret name for GitHub PAT (optional). Secret JSON
      must include key 'github_token'
  AmplifyBranchName:
    Type: String
    Default: main
    Description: 'Branch name to create in Amplify (default: main)'
Conditions:
  UseGitHub:
    Fn::Not:
    - Fn::Equals:
      - Ref: GitHubRepo
      - ''
Resources:
  CognitoUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName:
        Fn::Sub: ${EnvironmentName}-userpool
      AutoVerifiedAttributes:
      - email
      UsernameAttributes:
      - email
      Schema:
      - Name: email
        Required: true
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: false
          RequireNumbers: false
          RequireUppercase: false
          RequireSymbols: false
  CognitoUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName:
        Fn::Sub: ${EnvironmentName}-userpool-client
      UserPoolId:
        Ref: CognitoUserPool
      GenerateSecret: false
      ExplicitAuthFlows:
      - ALLOW_USER_PASSWORD_AUTH
      - ALLOW_REFRESH_TOKEN_AUTH
      - ALLOW_USER_SRP_AUTH
      PreventUserExistenceErrors: ENABLED
      SupportedIdentityProviders:
      - COGNITO
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows:
      - code
      AllowedOAuthScopes:
      - email
      - openid
      - profile
      CallbackURLs:
        Ref: CallbackURLs
      LogoutURLs:
        Ref: LogoutURLs
  CognitoIdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName:
        Fn::Sub: ${EnvironmentName}-identity-pool
      AllowUnauthenticatedIdentities: false
      CognitoIdentityProviders:
      - ClientId:
          Ref: CognitoUserPoolClient
        ProviderName:
          Fn::Sub: cognito-idp.${AWS::Region}.amazonaws.com/${CognitoUserPool}
        ServerSideTokenCheck: false
  CognitoAuthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud:
                Ref: CognitoIdentityPool
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      - arn:aws:iam::aws:policy/AmazonS3ReadOnlyAccess
  CognitoUnauthRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Federated: cognito-identity.amazonaws.com
          Action: sts:AssumeRoleWithWebIdentity
          Condition:
            StringEquals:
              cognito-identity.amazonaws.com:aud:
                Ref: CognitoIdentityPool
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId:
        Ref: CognitoIdentityPool
      Roles:
        authenticated:
          Fn::GetAtt:
          - CognitoAuthRole
          - Arn
        unauthenticated:
          Fn::GetAtt:
          - CognitoUnauthRole
          - Arn
  BedrockAgentServiceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - bedrock.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AmazonBedrockFullAccess
      - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Path: /
  BedrockAgent:
    Type: AWS::Bedrock::Agent
    Properties:
      AgentName:
        Ref: BedrockAgentName
      AgentResourceRoleArn:
        Fn::GetAtt:
        - BedrockAgentServiceRole
        - Arn
      FoundationModel:
        Ref: BedrockModelId
      AutoPrepare: true
      Instruction: 'You are a helpful and concise assistant that answers user questions,
        follows safety guidelines, and returns clear, actionable responses.

        '
      Description:
        Fn::Sub: Agent created by stack ${AWS::StackName}
  BedrockAgentAlias:
    Type: AWS::Bedrock::AgentAlias
    Properties:
      AgentId:
        Fn::GetAtt:
        - BedrockAgent
        - AgentId
      AgentAliasName:
        Fn::Sub: ${EnvironmentName}-alias
      Description: Alias created by SAM template
    DependsOn: BedrockAgent
  PetsChatbotTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName:
        Fn::Sub: ${AWS::StackName}-chatdata
      AttributeDefinitions:
      - AttributeName: PK
        AttributeType: S
      - AttributeName: SK
        AttributeType: S
      KeySchema:
      - AttributeName: PK
        KeyType: HASH
      - AttributeName: SK
        KeyType: RANGE
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
  ChatApi:
    Type: AWS::Serverless::Api
    Properties:
      Name:
        Fn::Sub: ${AWS::StackName}-ChatApi
      StageName: Prod
      Cors:
        AllowMethods: '''OPTIONS,GET,POST,PUT,DELETE'''
        AllowHeaders: '''Content-Type,Authorization'''
        AllowOrigin: '''*'''
  ChatApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-new-chat-api
      Description: API para crear chats en DynamoDB
      CodeUri: ChatApiFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE:
            Ref: PetsChatbotTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PetsChatbotTable
      Events:
        ApiPost:
          Type: Api
          Properties:
            Path: /chats
            Method: post
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: ChatApiFunction
  StoreMessageApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-store-message-api
      Description: API para guardar mensajes de usuario y agente en DynamoDB
      CodeUri: StoreMessageApiFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE:
            Ref: PetsChatbotTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PetsChatbotTable
      Events:
        ApiPostMessage:
          Type: Api
          Properties:
            Path: /chats/{chatId}/messages
            Method: post
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: StoreMessageApiFunction
  GetUserChatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-get-user-chats
      Description: Devuelve todos los chats asociados a un usuario (por email)
      CodeUri: GetUserChatsFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE:
            Ref: PetsChatbotTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: PetsChatbotTable
      Events:
        ApiGetUserChats:
          Type: Api
          Properties:
            Path: /chats
            Method: get
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: GetUserChatsFunction
  GetChatMessagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-get-chat-messages
      Description: "Devuelve todos los mensajes asociados a un chat espec\xEDfico"
      CodeUri: GetChatMessagesFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE:
            Ref: PetsChatbotTable
      Policies:
      - DynamoDBReadPolicy:
          TableName:
            Ref: PetsChatbotTable
      Events:
        ApiGetChatMessages:
          Type: Api
          Properties:
            Path: /chats/{chatId}/messages
            Method: get
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: GetChatMessagesFunction
  UpdateChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-update-chat
      Description: Actualiza el nombre de un chat en DynamoDB (PUT /chats/{chatId})
      CodeUri: UpdateChatFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE:
            Ref: PetsChatbotTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PetsChatbotTable
      Events:
        ApiPutChat:
          Type: Api
          Properties:
            Path: /chats/{chatId}
            Method: put
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: UpdateChatFunction
  DeleteChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-delete-chat
      Description: Elimina un chat y todos sus mensajes en DynamoDB (DELETE /chats/{chatId})
      CodeUri: DeleteChatFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 128
      Environment:
        Variables:
          CHAT_TABLE:
            Ref: PetsChatbotTable
      Policies:
      - DynamoDBCrudPolicy:
          TableName:
            Ref: PetsChatbotTable
      Events:
        ApiDeleteChat:
          Type: Api
          Properties:
            Path: /chats/{chatId}
            Method: delete
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: DeleteChatFunction
  AmplifyServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${EnvironmentName}-amplify-service-role-${AWS::AccountId}
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - amplify.amazonaws.com
            - codebuild.amazonaws.com
          Action: sts:AssumeRole
      ManagedPolicyArns:
      - arn:aws:iam::aws:policy/AdministratorAccess
  AmplifyApp:
    Type: AWS::Amplify::App
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-amplify-app
      Repository:
        Fn::If:
        - UseGitHub
        - Ref: GitHubRepo
        - Ref: AWS::NoValue
      AccessToken:
        Fn::If:
        - UseGitHub
        - Fn::Sub: '{{resolve:secretsmanager:${GitHubAccessTokenSecretName}:SecretString:github_token}}'
        - Ref: AWS::NoValue
      IAMServiceRole:
        Fn::GetAtt:
        - AmplifyServiceRole
        - Arn
      EnvironmentVariables:
      - Name: REACT_APP_USER_POOL_ID
        Value:
          Ref: CognitoUserPool
      - Name: REACT_APP_USER_POOL_CLIENT_ID
        Value:
          Ref: CognitoUserPoolClient
      - Name: REACT_APP_IDENTITY_POOL_ID
        Value:
          Ref: CognitoIdentityPool
      - Name: REACT_APP_REGION
        Value:
          Ref: AWS::Region
      - Name: REACT_APP_BEDROCK_AGENT_ID
        Value:
          Fn::GetAtt:
          - BedrockAgent
          - AgentId
      - Name: VITE_USER_POOL_ID
        Value:
          Ref: CognitoUserPool
      - Name: VITE_USER_POOL_CLIENT_ID
        Value:
          Ref: CognitoUserPoolClient
      - Name: VITE_IDENTITY_POOL_ID
        Value:
          Ref: CognitoIdentityPool
      - Name: VITE_REGION
        Value:
          Ref: AWS::Region
      - Name: VITE_BEDROCK_AGENT_ID
        Value:
          Fn::GetAtt:
          - BedrockAgent
          - AgentId
      - Name: VITE_SEARCH_API_URL
        Value:
          Fn::Sub: https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/Prod
      BuildSpec: "version: 1\nfrontend:\n  phases:\n    preBuild:\n      commands:\n\
        \        - if [ -f package-lock.json ]; then npm ci; else npm install; fi\n\
        \    build:\n      commands:\n        - npm run build\n  artifacts:\n    baseDirectory:\
        \ dist\n    files:\n      - \"**/*\"\n  cache:\n    paths:\n      - node_modules/**/*\n"
  AmplifyBranch:
    Type: AWS::Amplify::Branch
    Properties:
      AppId:
        Fn::GetAtt:
        - AmplifyApp
        - AppId
      BranchName:
        Ref: AmplifyBranchName
      EnableAutoBuild:
        Fn::If:
        - UseGitHub
        - true
        - false
      EnablePerformanceMode: false
      Stage: PRODUCTION
    DependsOn: AmplifyApp
  OpenSearchEncryptionPolicy:
    Type: AWS::OpenSearchServerless::SecurityPolicy
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-chat-encryption-policy
      Type: encryption
      Description: Encryption policy for chat collection
      Policy:
        Fn::Sub: '{"Rules":[{"ResourceType":"collection","Resource":["collection/${EnvironmentName}-chat-collection"]}],"AWSOwnedKey":true}

          '
  OpenSearchCollection:
    Type: AWS::OpenSearchServerless::Collection
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-chat-collection
      Type: SEARCH
      Description: Serverless collection for chatbot (search)
    DependsOn:
    - OpenSearchEncryptionPolicy
  OpenSearchIngestionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${EnvironmentName}-osis-pipeline-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - osis-pipelines.amazonaws.com
          Action: sts:AssumeRole
      Path: /
      Policies:
      - PolicyName: AllowDDBReadAndAossWrite
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - dynamodb:DescribeStream
            - dynamodb:GetRecords
            - dynamodb:GetShardIterator
            - dynamodb:ListStreams
            - dynamodb:DescribeTable
            Resource:
            - Fn::GetAtt:
              - PetsChatbotTable
              - StreamArn
          - Effect: Allow
            Action:
            - aoss:BatchPutDocument
            - aoss:CreateIndex
            - aoss:APIAccessAll
            - aoss:BatchGetCollection
            Resource:
            - Fn::GetAtt:
              - OpenSearchCollection
              - Arn
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action:
            - aoss:GetSecurityPolicy
            - aoss:CreateSecurityPolicy
            - aoss:UpdateSecurityPolicy
            - aoss:DeleteSecurityPolicy
            - aoss:ListSecurityPolicies
            Resource: '*'
  OpenSearchDataAccessPolicy:
    Type: AWS::OpenSearchServerless::AccessPolicy
    DependsOn:
    - OpenSearchCollection
    - OpenSearchIngestionRole
    - SearchApiFunctionRole
    Properties:
      Name:
        Fn::Sub: ${EnvironmentName}-data-access-policy
      Type: data
      Description: Allow ingestion and search roles access
      Policy:
        Fn::Sub:
        - "[\n  {\n    \"Description\": \"Allow ingestion and search roles access\"\
          ,\n    \"Rules\": [\n      {\n        \"ResourceType\": \"collection\",\n\
          \        \"Resource\": [\"collection/${CollectionName}\"],\n        \"Permission\"\
          : [\"aoss:CreateCollectionItems\",\"aoss:DescribeCollectionItems\"]\n  \
          \    },\n      {\n        \"ResourceType\": \"index\",\n        \"Resource\"\
          : [\"index/${CollectionName}/${IndexName}\"],\n        \"Permission\": [\"\
          aoss:ReadDocument\",\"aoss:WriteDocument\",\"aoss:CreateIndex\",\"aoss:DescribeIndex\"\
          ]\n      }\n    ],\n    \"Principal\": [\n      \"${IngestRoleArn}\",\n\
          \      \"${SearchRoleArn}\"\n    ]\n  }\n]\n"
        - IngestRoleArn:
            Fn::GetAtt:
            - OpenSearchIngestionRole
            - Arn
          SearchRoleArn:
            Fn::GetAtt:
            - SearchApiFunctionRole
            - Arn
          CollectionName:
            Fn::Sub: ${EnvironmentName}-chat-collection
          IndexName: chats
  SearchApiFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName:
        Fn::Sub: ${AWS::StackName}-search-api-role
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
        - Effect: Allow
          Principal:
            Service:
            - lambda.amazonaws.com
          Action: sts:AssumeRole
      Path: /
      Policies:
      - PolicyName: SearchApiBasicPermissions
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
          - Effect: Allow
            Action:
            - logs:CreateLogGroup
            - logs:CreateLogStream
            - logs:PutLogEvents
            Resource:
              Fn::Sub: arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:*
          - Effect: Allow
            Action:
            - aoss:APIAccessAll
            - aoss:DashboardsAccessAll
            - aoss:Search
            - aoss:ReadDocument
            - aoss:DescribeIndex
            Resource: '*'
  SearchApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName:
        Fn::Sub: ${AWS::StackName}-search-api
      Description: API para buscar chats (proxy seguro a OpenSearch Serverless collection)
      CodeUri: SearchApiFunction
      Handler: app.lambda_handler
      Runtime: python3.12
      Timeout: 10
      MemorySize: 256
      Role:
        Fn::GetAtt:
        - SearchApiFunctionRole
        - Arn
      Environment:
        Variables:
          OPENSEARCH_ENDPOINT:
            Fn::GetAtt:
            - OpenSearchCollection
            - CollectionEndpoint
          OPENSEARCH_INDEX: chats
      Events:
        ApiSearch:
          Type: Api
          Properties:
            Path: /search
            Method: get
            RestApiId:
              Ref: ChatApi
    Metadata:
      SamResourceId: SearchApiFunction
Outputs:
  UserPoolId:
    Description: Cognito User Pool Id
    Value:
      Ref: CognitoUserPool
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:UserPoolId
  UserPoolClientId:
    Description: Cognito User Pool Client Id
    Value:
      Ref: CognitoUserPoolClient
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:UserPoolClientId
  IdentityPoolId:
    Description: Cognito Identity Pool Id
    Value:
      Ref: CognitoIdentityPool
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:IdentityPoolId
  CognitoAuthRoleArn:
    Description: ARN of authenticated role used by identity pool
    Value:
      Fn::GetAtt:
      - CognitoAuthRole
      - Arn
  BedrockAgentArn:
    Description: ARN of the created Bedrock Agent
    Value:
      Fn::GetAtt:
      - BedrockAgent
      - AgentArn
  BedrockAgentId:
    Description: Bedrock Agent Id
    Value:
      Fn::GetAtt:
      - BedrockAgent
      - AgentId
  AmplifyAppId:
    Description: Amplify App Id
    Value:
      Fn::GetAtt:
      - AmplifyApp
      - AppId
  AmplifyBranchArn:
    Description: Amplify Branch ARN (constructed)
    Value:
      Fn::Sub:
      - arn:aws:amplify:${AWS::Region}:${AWS::AccountId}:apps/${AppId}/branches/${BranchName}
      - AppId:
          Fn::GetAtt:
          - AmplifyApp
          - AppId
        BranchName:
          Ref: AmplifyBranchName
  OpenSearchCollectionName:
    Description: OpenSearch Serverless collection name
    Value:
      Ref: OpenSearchCollection
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:OpenSearchCollectionName
  DynamoDBStreamArn:
    Description: "DynamoDB Stream ARN (usar para debug/pol\xEDticas)"
    Value:
      Fn::GetAtt:
      - PetsChatbotTable
      - StreamArn
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:DDBStreamArn
  SearchApiUrl:
    Description: "Endpoint p\xFAblico del API para b\xFAsquedas (stage Prod)"
    Value:
      Fn::Sub: https://${ChatApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/search
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:SearchApiUrl
  OpenSearchCollectionEndpoint:
    Description: OpenSearch Serverless collection endpoint
    Value:
      Fn::GetAtt:
      - OpenSearchCollection
      - CollectionEndpoint
    Export:
      Name:
        Fn::Sub: ${AWS::StackName}:OpenSearchCollectionEndpoint
